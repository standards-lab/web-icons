# Adapted from web-foundation (72e759f): mise.toml, its pins, on the icons generator's build.
# Adapted from spike-html-hosting-icons (8b8d955): mise.toml, its tiers, browse, and screenshots.
# The repository's tools and tasks.
# See docs/internals.md
[settings]
task.run_auto_install = false

[tools]
"github:standards-lab/claude-plugins" = { version = "0.22.0", version_prefix = "marathon/v" }
actionlint = "1.7.12"
node = "26.13.1"
pnpm = "12.21.0"
shellcheck = "0.11.0"
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }

[tools."http:chrome-headless-shell"]
version = "158.0.8127.36"
version_list_url = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"
version_json_path = ".channels.Stable.version"

[tools."http:chrome-headless-shell".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-headless-shell-linux64.zip", checksum = "sha256:2d3a23017323c54fd457a678e4351f895c4076d8050e39d5aa6247f93448b73a", size = "132087165" }

[tasks.preflight]
description = "Fail naming mise run install when a tool the tasks need is missing"
hide = true
run = "scripts/preflight.sh"

[tasks.lint]
description = "Run the linters: ESLint, Prettier, shellcheck, actionlint, lint-context, and lint-references"
depends = ["lint:eslint", "lint:format", "lint:shell", "lint:workflows", "lint:context"]

[tasks."lint:eslint"]
description = "Lint with ESLint, the layer's imports included"
depends = ["preflight"]
run = "pnpm exec eslint ."

[tasks."lint:format"]
description = "Check the format with Prettier"
depends = ["preflight"]
run = "pnpm exec prettier --check ."

[tasks."lint:shell"]
description = "Shellcheck the scripts"
run = "shellcheck scripts/*.sh"

[tasks."lint:workflows"]
description = "Lint the GitHub Actions workflows with actionlint, which shellchecks each run: block with the pinned shellcheck"
run = "actionlint"

[tasks."lint:context"]
description = "Lint the context and every reference with marathon's lint-context and lint-references"
run = "scripts/lint-marathon.sh"

[tasks.types]
description = "Type-check the plugin's sources, the scripts and suite, and the browse page's modules with tsc, never emitting"
depends = ["types:src", "types:test", "types:browse"]

[tasks."types:src"]
description = "Type-check the plugin's sources with tsc"
depends = ["preflight"]
run = "tsc --noEmit -p ."

[tasks."types:test"]
description = "Type-check the scripts, the suite, and the Vite fixtures with tsc, under tsconfig.test.json, the package's own exports resolving to the build's declarations"
depends = ["preflight", "build"]
run = "tsc -p tsconfig.test.json"

[tasks."types:browse"]
description = "Type-check the browse page's modules with tsc, under the DOM's lib, never emitting"
depends = ["preflight"]
run = "tsc -p browse"

[tasks.build]
description = "Generate the released icon sets, sets.json's, from the installed @iconify-json packages into a fresh dist/, and build the plugin beside them with tsc"
depends = ["preflight"]
run = ["node scripts/build.ts", "tsc -p ."]

[tasks."test:unit"]
description = "Run the unit tier on the generator, its fixture sets, the plugin and its Vite fixtures, the release's manifest, and a pack of the build"
depends = ["preflight", "build"]
run = "node --test 'test/unit/*.test.ts'"

[tasks."test:browser"]
description = "Run the browser tier on the browse page, over dist/, in the pinned chrome-headless-shell, and the screenshots command and the preview script once each, their captures under a scratch TMPDIR"
depends = ["preflight browser", "build"]
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) node --test 'test/browser/*.test.ts'"

[tasks.check]
description = "Run every check: the linters, lint-context and lint-references among them, types, build, and the unit and browser tiers; reads no network; writes dist/"
depends = ["lint", "types", "build", "test:unit", "test:browser"]

[tasks.browse]
description = "Serve the browse page over dist/ on a free loopback port, as the browser tier serves it, and print its URL; stop with Ctrl-C"
depends = ["preflight", "build"]
run = "node scripts/browse.ts"

[tasks.screenshots]
description = "Capture the browse page whole, wide and narrow, light and dark, inline in kitty: at the defaults, or --palette/--space/--type <name>, or --all for every profile; --scheme light|dark narrows it; --output terminal|directory|browser and --dir <path> choose where they go; --keep leaves the captures"
depends = ["preflight browser", "build"]
raw = true
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) pnpm exec web-screenshots scripts/screenshots.config.ts"

[tasks.preview]
description = "Regenerate README's preview, docs/preview-light.png and docs/preview-dark.png: the browse page's first wide tile at the default profile, light and dark; or into the directory its one argument names"
depends = ["preflight browser", "build"]
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) node scripts/preview.ts"

[tasks.install]
description = "Install the pins and node_modules, the foundation and the tooling at their tags; reads the network"
run = ["mise install", "pnpm install --frozen-lockfile"]

[tasks.currency]
description = "Report every mise tool, package.json pin, action pin, the vite peer's range, and the foundation's and the tooling's tags behind its latest, exiting nonzero if any; reads the network"
run = "scripts/currency.sh"
quiet = true
