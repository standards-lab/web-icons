<!doctype html>
<!-- Adapted from spike-html-hosting-icons (8b8d955): browse/index.html, its theme menu replaced by plain selects.
     Adapted from web-foundation (72e759f): demo/theme.html, its plain selects.
     The browse page, dev-only and never packed: every glyph of every released set, by set, each
     beside its name. scripts/served.ts serves it at /browse/, for mise run browse, the browser
     tier, and mise run screenshots. It loads the foundation as a site does, every profile
     registered and the stored choice applied before first paint; the query's palette, space,
     type, and scheme set the root's attributes first, which a stored choice replaces.
     window.errors collects the page's errors; window.ready settles once every glyph is in it.
     See docs/internals.md -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>web-icons: browse</title>
    <script>
      window.errors = [];
      window.addEventListener("error", (event) => window.errors.push(String(event.message)));
      window.addEventListener("unhandledrejection", (event) =>
        window.errors.push(String(event.reason)),
      );
      {
        const query = new URLSearchParams(location.search);
        const attributes = { palette: "data-palette", space: "data-space", type: "data-type", scheme: "data-scheme" };
        for (const [key, attribute] of Object.entries(attributes)) {
          const value = query.get(key);
          if (value !== null) document.documentElement.setAttribute(attribute, value);
        }
      }
    </script>
    <link rel="stylesheet" href="/deps/@standards-lab/web-foundation/dist/page-full.css" />
    <style>
      body {
        display: grid;
        align-content: start;
        gap: var(--space-l);
        padding: var(--space-m);
      }
      body > header,
      form[data-choice] {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        justify-content: space-between;
        gap: var(--space-s);
      }
      form[data-choice] {
        justify-content: start;
      }
      main,
      section {
        display: grid;
        gap: var(--space-m);
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      .about {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: var(--space-xs) var(--space-s);
        margin: 0;
      }
      .about :is(dt, dd) {
        margin: 0;
      }
      .about dd {
        overflow-wrap: anywhere;
      }
      .glyphs {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, calc(6.5rem + 2 * var(--space-xs))), 1fr));
        gap: var(--space-xs);
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .glyphs li {
        display: grid;
        justify-items: center;
        align-content: start;
        gap: var(--space-xs);
        margin: 0;
        padding: var(--space-xs);
        border: var(--line-s) solid var(--border);
        text-align: center;
      }
      .glyph {
        display: flex;
        font-size: 2rem;
      }
      .glyphs code {
        font-size: 0.75rem;
        overflow-wrap: normal;
        word-break: normal;
        min-inline-size: 0;
        max-inline-size: 100%;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@standards-lab/web-foundation/": "/deps/@standards-lab/web-foundation/dist/"
        }
      }
    </script>
    <script type="module" blocking="render" src="/deps/@standards-lab/web-foundation/dist/register-full.js"></script>
    <script type="module" blocking="render" src="/deps/@standards-lab/web-foundation/dist/preferences.js"></script>
    <script type="module" src="./browse.js"></script>
    <script type="module" src="./choice.js"></script>
  </head>
  <body>
    <header>
      <h1>web-icons</h1>
      <form data-choice>
        <div class="field">
          <label for="color">Color</label>
          <select id="color" name="color"></select>
        </div>
        <div class="field">
          <label for="scheme">Scheme</label>
          <select id="scheme" name="scheme"></select>
        </div>
        <div class="field">
          <label for="space">Space</label>
          <select id="space" name="space"></select>
        </div>
        <div class="field">
          <label for="type">Type</label>
          <select id="type" name="type"></select>
        </div>
      </form>
    </header>
    <main>
      <p>
        Every glyph of every released set, by its name, as
        <code>@standards-lab/web-icons/&lt;set&gt;/&lt;name&gt;</code> imports it.
      </p>
    </main>
  </body>
</html>
